name: Manage stale issues and PRs

on:
  workflow_call:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Check for stale issues and PRs
        uses: actions/github-script@v7
        env:
          REVIEWERS: "krkn-maintainers"
        with:
          script: |
            const STALE_ASSIGNMENT_DAYS = 14;
            const GRACE_PERIOD_DAYS = 3;
            const STALE_TRIAGE_DAYS = 14;
            const STALE_APPROVED_DAYS = 30;
            const STALE_PR_DAYS = 14;
            const STALE_PR_CLOSE_DAYS = 7;
            const NON_COMPLIANT_REMINDER_DAYS = 7;
            const NON_COMPLIANT_CLOSE_DAYS = 14;
            const REVIEW_REMINDER_DAYS = 7;
            const MAX_REVIEW_REMINDERS = 3;
          
            const MS_PER_DAY = 24 * 60 * 60 * 1000;
            const now = Date.now();
            const reviewers = `@${context.repo.owner}/${process.env.REVIEWERS}`;
          
            function daysSince(dateStr) {
              return (now - new Date(dateStr).getTime()) / MS_PER_DAY;
            }
          
            async function hasCommentMarker(issueNumber, marker) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100
              });
              return comments.some(c => c.body.includes(`<!-- ${marker} -->`));
            }
          
            async function postComment(issueNumber, marker, body) {
              if (await hasCommentMarker(issueNumber, marker)) {
                console.log(`Skipping duplicate comment on #${issueNumber} (${marker})`);
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `<!-- ${marker} -->\n${body}`
              });
            }
          
            // ─── Issues ───
          
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
          
            for (const issue of issues) {
              if (issue.pull_request) continue;
          
              const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100
              });
          
              const labels = issue.labels.map(l => l.name);
              const hasLinkedPR = timeline.some(e =>
                e.event === 'cross-referenced' && e.source?.issue?.pull_request
              );
          
              // 1. Stale assignment grace period expired
              if (labels.includes('stale-assignment')) {
                const staleEvent = [...timeline].reverse().find(e =>
                  e.event === 'labeled' && e.label?.name === 'stale-assignment'
                );
                if (!staleEvent) continue;
          
                const daysSinceStale = daysSince(staleEvent.created_at);
                const staleTime = new Date(staleEvent.created_at).getTime();
                const assigneeLogins = issue.assignees.map(a => a.login);
                const assigneeResponded = timeline.some(e =>
                  e.event === 'commented' &&
                  assigneeLogins.includes(e.actor?.login) &&
                  new Date(e.created_at).getTime() > staleTime
                );
          
                if (assigneeResponded) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      name: 'stale-assignment'
                    });
                    console.log(`#${issue.number}: assignee responded, removed stale-assignment`);
                  } catch (e) {
                    console.log(`#${issue.number}: error removing stale-assignment: ${e.message}`);
                  }
                  continue;
                }
          
                if (daysSinceStale >= GRACE_PERIOD_DAYS) {
                  for (const assignee of assigneeLogins) {
                    await github.rest.issues.removeAssignees({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      assignees: [assignee]
                    });
                  }
          
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      name: 'stale-assignment'
                    });
                  } catch (e) {
                    console.log(`#${issue.number}: error removing stale-assignment: ${e.message}`);
                  }
          
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    labels: ['help-wanted']
                  });
          
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      name: 'triage/accepted'
                    });
                  } catch (e) {
                    console.log(`#${issue.number}: error removing triage/accepted: ${e.message}`);
                  }
          
                  await postComment(issue.number, 'stale-assignment-expired',
                    `You have been unassigned due to inactivity. This issue is now open for other contributors — feel free to comment your interest in working on it!`
                  );
          
                  console.log(`#${issue.number}: grace period expired, unassigned and added help-wanted`);
                }
                continue;
              }
          
              // 2. Stale assignment — assigned + triage/accepted, no PR after threshold
              if (labels.includes('triage/accepted') && issue.assignees.length > 0 && !hasLinkedPR) {
                const assignEvent = [...timeline].reverse().find(e =>
                  e.event === 'assigned' && issue.assignees.some(a => a.login === e.assignee?.login)
                );
                if (assignEvent && daysSince(assignEvent.created_at) >= STALE_ASSIGNMENT_DAYS) {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    labels: ['stale-assignment']
                  });
          
                  const assignee = `@${issue.assignees[0].login}`;
                  await postComment(issue.number, 'stale-assignment-reminder',
                    `Hi ${assignee}, it's been ${Math.floor(daysSince(assignEvent.created_at))} days since you were assigned to this issue and no PR has been submitted. Are you still working on this? Please respond within ${GRACE_PERIOD_DAYS} days, otherwise you'll be unassigned so others can pick it up.`
                  );
          
                  console.log(`#${issue.number}: stale assignment, reminded ${assignee}`);
                }
                continue;
              }
          
              // 3. Stale triage — needs-triage for threshold days
              if (labels.includes('needs-triage')) {
                const triageEvent = [...timeline].reverse().find(e =>
                  e.event === 'labeled' && e.label?.name === 'needs-triage'
                );
                if (triageEvent && daysSince(triageEvent.created_at) >= STALE_TRIAGE_DAYS) {
                  await postComment(issue.number, 'stale-triage-reminder',
                    `Reminder: this issue has been awaiting triage for ${Math.floor(daysSince(triageEvent.created_at))} days. ${reviewers} could you please review when you get a chance?`
                  );
                  console.log(`#${issue.number}: stale triage reminder`);
                }
                continue;
              }
          
              // 4. Stale approved issue — triage/accepted, no PR, no assignee
              if (labels.includes('triage/accepted') && issue.assignees.length === 0 && !hasLinkedPR) {
                const acceptedEvent = [...timeline].reverse().find(e =>
                  e.event === 'labeled' && e.label?.name === 'triage/accepted'
                );
                if (acceptedEvent && daysSince(acceptedEvent.created_at) >= STALE_APPROVED_DAYS) {
                  await postComment(issue.number, 'stale-approved-reminder',
                    `This issue has been approved but no PR has been submitted in ${Math.floor(daysSince(acceptedEvent.created_at))} days. It is still open for contributors — feel free to pick it up!`
                  );
                  console.log(`#${issue.number}: stale approved issue reminder`);
                }
              }
            }
          
            // ─── Pull Requests ───

            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            for (const pr of prs) {
              const prComments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100
              });

              // 1. Non-compliant PR handling (7-day reminder, 14-day auto-close)
              const nonCompliantComment = [...prComments].reverse()
                .find(c => c.body.includes('<!-- non-compliant-pr -->'));
              if (nonCompliantComment) {
                const daysSinceNonCompliant = daysSince(nonCompliantComment.created_at);
                const activityAfter = new Date(pr.updated_at).getTime() >
                  new Date(nonCompliantComment.created_at).getTime();

                if (!activityAfter) {
                  if (daysSinceNonCompliant >= NON_COMPLIANT_CLOSE_DAYS) {
                    await postComment(pr.number, 'non-compliant-closed',
                      `Closing this PR as the contribution guidelines have not been followed. Feel free to reopen once the requirements are met. See our [contribution guidelines](CONTRIBUTING.md) for details.`
                    );
                    await github.rest.pulls.update({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: pr.number,
                      state: 'closed'
                    });
                    console.log(`PR #${pr.number}: closed (non-compliant for ${Math.floor(daysSinceNonCompliant)} days)`);
                  } else if (daysSinceNonCompliant >= NON_COMPLIANT_REMINDER_DAYS) {
                    await postComment(pr.number, 'non-compliant-reminder',
                      `Hi @${pr.user.login}, this PR still doesn't meet the contribution guidelines. Please address the missing items within 7 days, otherwise this PR will be closed. Feel free to reopen once the guidelines are followed.`
                    );
                    console.log(`PR #${pr.number}: non-compliant reminder sent`);
                  }
                }
                continue;
              }

              // 2. Check review state to distinguish contributor vs maintainer stale
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100
              });

              const latestReviewByUser = {};
              for (const review of reviews) {
                if (review.state === 'COMMENTED' || review.state === 'PENDING') continue;
                const prev = latestReviewByUser[review.user.login];
                if (!prev || new Date(review.submitted_at) > new Date(prev.submitted_at)) {
                  latestReviewByUser[review.user.login] = review;
                }
              }

              const changesRequested = Object.values(latestReviewByUser)
                .filter(r => r.state === 'CHANGES_REQUESTED')
                .sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));

              // 2a. Awaiting contributor: changes requested, no activity since
              if (changesRequested.length > 0) {
                const lastRequest = changesRequested[0];
                const contributorUpdated = new Date(pr.updated_at).getTime() >
                  new Date(lastRequest.submitted_at).getTime();

                if (!contributorUpdated) {
                  const daysSinceRequest = daysSince(lastRequest.submitted_at);
                  const reminder = prComments.find(c =>
                    c.body.includes('<!-- stale-pr-contributor-reminder -->'));

                  if (reminder) {
                    const daysSinceReminder = daysSince(reminder.created_at);

                    if (daysSinceReminder >= STALE_PR_CLOSE_DAYS) {
                      await postComment(pr.number, 'stale-pr-closed',
                        `Closing this PR due to inactivity. Feel free to reopen when you're ready to continue. If you have any questions, please reach out in the issue thread.`
                      );
                      await github.rest.pulls.update({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: pr.number,
                        state: 'closed'
                      });
                      console.log(`PR #${pr.number}: closed (contributor inactive after changes requested)`);
                    }
                  } else if (daysSinceRequest >= STALE_PR_DAYS) {
                    await postComment(pr.number, 'stale-pr-contributor-reminder',
                      `Hi @${pr.user.login}, this PR has had changes requested for ${Math.floor(daysSinceRequest)} days with no updates. Please respond or push changes within ${STALE_PR_CLOSE_DAYS} days, otherwise this PR will be closed. Feel free to reopen when you're ready to continue.`
                    );
                    console.log(`PR #${pr.number}: reminded contributor (changes requested ${Math.floor(daysSinceRequest)} days ago)`);
                  }
                }
                continue;
              }

              // 2b. Awaiting maintainer review (gentle reminders, max 3)
              const daysSinceUpdate = daysSince(pr.updated_at);
              if (daysSinceUpdate >= REVIEW_REMINDER_DAYS) {
                const reviewReminders = prComments.filter(c =>
                  c.body.includes('<!-- review-reminder -->'));
                const lastReminder = reviewReminders.length > 0
                  ? reviewReminders[reviewReminders.length - 1]
                  : null;

                const shouldRemind = reviewReminders.length < MAX_REVIEW_REMINDERS &&
                  (!lastReminder || daysSince(lastReminder.created_at) >= REVIEW_REMINDER_DAYS);

                if (shouldRemind) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body: `<!-- review-reminder -->\nGentle reminder: this PR has been awaiting review for ${Math.floor(daysSinceUpdate)} days. ${reviewers} could you take a look when you get a chance?`
                  });
                  console.log(`PR #${pr.number}: review reminder #${reviewReminders.length + 1} sent`);
                }
              }
            }
