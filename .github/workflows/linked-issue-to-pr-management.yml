name: Linked issue to PR Management

on:
  workflow_call:
    secrets:
      ISSUE_PR_CLASSIC:
        required: false

jobs:
  handle-issue:
    if: github.event_name == 'issues' 
    runs-on: ubuntu-latest

    steps:
      - name: Request issue approval and assignment
        uses: actions/github-script@v7
        env: 
          REVIEWERS: "krkn-maintainers"
        with:
          script: |
            const issue = context.payload.issue;
            const action = context.payload.action;

            // 1. Auto-Triage on Issue Open
            if (action === 'opened') {

              // Standard Triage Flow (including bug issues)
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['needs-triage']
              });

              // Post comment and tag the reviewers
              const reviewers = `@${context.repo.owner}/${process.env.REVIEWERS}`;

              const comment = `Thanks for opening this issue! A maintainer will review it shortly. Please wait for approval before starting work on a PR. See our [contributing guidelines](https://krkn-chaos.dev/docs/contribution-guidelines/) for more details. \n\nCC: ${reviewers}`;
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: comment
              });

              console.log(`Issue #${issue.number} labeled and reviewers notified`);
            }
            
            // 2. Maintainer Approval Flow
            if (action === 'labeled') {
              if (context.payload.label.name !== 'triage/accepted') {
                console.log(`Label ${context.payload.label.name} added - no action needed`);
                return;
              }
                         
              // Remove needs-triage
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: 'needs-triage'
                });
                console.log(`Removed 'needs-triage' label from issue #${issue.number}`);
              } catch (error) {
                console.log(`Error removing label: ${error.message}`);
                }

              const comment = `This issue has been approved and assigned by a maintainer! If you are the assignee, please submit a PR within 14 days using Fixes #<issue_number> in the PR description. If no PR is submitted, the issue will be opened up for other contributors.`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: comment
              });

              console.log(`Issue #${issue.number} has been assigned`); }

  handle-pr:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    name: Check linked issue

    steps:
      - name: Check linked issue and assign reviewers
        uses: nearform-actions/github-action-check-linked-issues@v1
        continue-on-error: true
        id: check-linked-issues
        with:
          exclude-branches: "release/**, dependabot/**"
          comment: false
      - name: Assign reviewers based on linked issue
        uses: actions/github-script@v7
        env:
          LINKED_ISSUES_COUNT: ${{ steps.check-linked-issues.outputs.linked_issues_count }}
          ISSUES_OUTPUT: ${{ steps.check-linked-issues.outputs.issues }}
          REVIEWERS: "krkn-maintainers"
          ISSUE_PR_CLASSIC: ${{ secrets.ISSUE_PR_CLASSIC }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const prCreator = pr.user.login;
            const isFastLane = ['MEMBER', 'OWNER', 'COLLABORATOR']
              .includes(pr.author_association);

            const linkedIssueCount = parseInt(process.env.LINKED_ISSUES_COUNT || '0');
            const issuesOutput = process.env.ISSUES_OUTPUT || '[]';

            if (linkedIssueCount === 0) {
              const comment = `<!-- non-compliant-pr -->\nThanks for your contribution! This PR does not appear to have a linked issue. Please refer to our [contribution guidelines](CONTRIBUTING.md) for the proper PR process.`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: comment
              });

              console.log('No linked issue found - posted comment');
              return;
            }
            // Check the first linked issue
            let issues;
            try {
              issues = JSON.parse(issuesOutput);
            } catch (e) {
              console.error(`Failed to parse linked issues output: ${e.message}`);
              const comment = `Unable to determine linked issues for this PR.`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: comment
              });
              return;
            }

            if (!issues || issues.length === 0) {
              console.log('No issues in output despite count > 0');
              return;
            }

            // Extract issue number - handles #123 format
            const issueNumber = parseInt(issues[0].split('#')[1]);

            try {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });

              const issueLabels = issue.labels.map(l => l.name);
              const isApproved = issueLabels.includes('triage/accepted') || issueLabels.includes('bug');
              const issueAssignees = issue.assignees.map(a => a.login);
              const isAssigned = issueAssignees.includes(prCreator);

              if (!isFastLane && (!isApproved || !isAssigned)) {
                const checklist = [
                  `- [x] PR references a linked issue`,
                  `- [${isApproved ? 'x' : ' '}] Linked issue has maintainer approval (\`triage/accepted\` or \`bug\` label)`,
                  `- [${isAssigned ? 'x' : ' '}] You are assigned to the linked issue`
                ].join('\n');

                const comment = `<!-- non-compliant-pr -->\nThanks for your contribution! Before this PR can be reviewed, please ensure the following:\n\n${checklist}\n\nPlease see our [contribution guidelines](CONTRIBUTING.md) for details. This PR will be auto-closed if not addressed within 14 days.`;

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: comment
                });

                console.log(`PR #${pr.number} non-compliant: approved=${isApproved}, assigned=${isAssigned}`);
                return;
              }

              // PR creator is assigned to the issue - assign reviewers
              try {
                const { getOctokit } = require('@actions/github');
                const patOctokit = getOctokit(process.env.ISSUE_PR_CLASSIC);
                await patOctokit.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  team_reviewers: [process.env.REVIEWERS]
                });
                console.log(`Assigned reviewers: ${process.env.REVIEWERS}`);
                const comment = `Thanks for your contribution! A reviewer has been assigned to review your PR.`;
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: comment
                });
              } catch (reviewError) {
                console.error(`Error assigning reviewers: ${reviewError.message}`);
              }

            } catch (error) {
              console.error(`Error checking issue #${issueNumber}:`, error);

              const comment = `Unable to verify the linked issue #${issueNumber}. Please ensure the issue exists and is properly configured.`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: comment
              });
            }
